; NavPlotter node for the Raspberry Pi Pico W / Pico 2 W with the Waveshare Pico-LoRa-SX1262 module (868 MHz)
; and an external GPS module. No screen: the board serves a web app over its own WiFi network.
; The board must be an original one with the W: see the README.

[platformio]
default_envs = pico-w

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Decimal numbers in printf (the web API is full of them) need this with PlatformIO
build_flags = -Wl,-u,_printf_float
; Turns web/index.html into src/web_page.h before every build
extra_scripts = pre:tools/embed_web.py
lib_deps =
	jgromes/RadioLib@^6.6.0
	mikalhart/TinyGPSPlus@^1.0.3

[env:pico-w]
board = rpipicow
board_build.filesystem_size = 0.5m

[env:pico2-w]
board = rpipico2w
board_build.filesystem_size = 1m
