; NavPlotter node for the Raspberry Pi Pico 2 W (RP2350) with the Waveshare Pico-LoRa-SX1262 module (868 MHz) and an
; external GPS module. No screen: the board serves a web app over its own WiFi network.

[env:pico2-w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1m
monitor_speed = 115200
; Decimal numbers in printf (the web API is full of them) need this with PlatformIO
build_flags = -Wl,-u,_printf_float
; Turns web/index.html into src/web_page.h before every build
extra_scripts = pre:tools/embed_web.py
lib_deps =
	jgromes/RadioLib@^6.6.0
	mikalhart/TinyGPSPlus@^1.0.3
