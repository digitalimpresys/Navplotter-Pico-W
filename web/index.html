<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b1d33">
<title>NavPlotter</title>
<style>
:root{--bg:#0b1d33;--panel:#12294a;--line:#27456f;--text:#eef3fa;--dim:#9db0c9;--accent:#3da5ff;--red:#e5383b;--green:#2fd16b;--water:#a9d3ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#status{display:flex;gap:12px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap;overflow:hidden}
#status b{font-size:17px}
#status .sp{flex:1}
#dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
#dot.ok{background:var(--green)}
#alarm{display:none;background:var(--red);color:#fff;font-weight:700;padding:6px 8px;font-size:15px;align-items:center;gap:8px}
#alarm.on{display:flex}
#alarmText{flex:1;text-align:center;animation:blink 1s steps(2) infinite}
#alarm.muted #alarmText{animation:none}
@keyframes blink{50%{opacity:.6}}
#mute{flex:none;border:2px solid #fff;background:none;color:#fff;border-radius:9px;padding:7px 10px;font-size:14px;font-weight:700}
#alarm.muted #mute{background:#fff;color:var(--red)}
#offline{display:none;background:#8a6d00;color:#fff;text-align:center;padding:4px;font-size:13px}
#offline.on{display:block}
main{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.page.on{display:block}
#pMap,#pCompass{overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#mapBtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
#mapBtns button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:rgba(18,41,74,.92);color:var(--text);font-size:24px;font-weight:700}
#mapBtns button.on{background:var(--accent);color:#04121f}
#mapInfo{position:absolute;left:10px;bottom:10px;background:rgba(18,41,74,.92);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;pointer-events:none}
#sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#sheet.on{display:block}
#sheet h3{margin:0 0 6px}
#sheet .row{display:flex;gap:8px;margin-top:10px}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:9px 2px 8px;font-size:12px}
nav button.on{color:var(--accent);font-weight:700}
nav button i{display:block;font-style:normal;font-size:20px;line-height:22px}
.wrap{padding:12px;max-width:640px;margin:0 auto}
h2{margin:6px 0 12px;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.alarm{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.card.stale{opacity:.55}
.card .title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.card .sub{color:var(--dim);font-size:14px;margin-top:4px}
.tag{font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--dim)}
.btn{background:var(--accent);color:#04121f;border:0;border-radius:9px;padding:10px 14px;font-size:15px;font-weight:700}
.btn.sec{background:none;color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label{display:block;margin:14px 0 6px;color:var(--dim);font-size:14px}
input[type=text],input[type=password],select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1d33;color:var(--text);font-size:16px}
.types{display:flex;gap:8px}
.types label{flex:1;margin:0;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;color:var(--text);font-size:14px}
.types input{display:none}
.types label.on{border-color:var(--accent);background:rgba(61,165,255,.16)}
.types canvas{width:44px;height:44px;margin:0 auto 4px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px}
.check input{width:22px;height:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--dim)}
.hint{color:var(--dim);font-size:13px;margin-top:6px}
.empty{color:var(--dim);text-align:center;padding:30px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--dim);padding:10px;font-size:15px}
.seg button.on{background:var(--accent);color:#04121f;font-weight:700}
.leg{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.leg span{flex:1}
.leg button{width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--text);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#pChat{overflow:hidden}
#chat{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
#chatPeers{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none;-webkit-overflow-scrolling:touch}
#chatPeers button{flex:none;border:1px solid var(--line);background:none;color:var(--text);border-radius:16px;padding:7px 13px;font-size:15px;white-space:nowrap;position:relative}
#chatPeers button.on{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:700}
#chatPeers button.gone{opacity:.55}
#chatPeers button.alarm{border-color:var(--red);color:var(--red)}
#chatPeers button.alarm.on{background:var(--red);color:#fff}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:700;text-align:center;margin-left:6px;padding:0 5px}
#chatLog{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.bub{max-width:82%;padding:8px 11px;border-radius:14px;font-size:16px;line-height:1.3;word-break:break-word}
.bub.in{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:#1d5fa8;border-bottom-right-radius:4px}
.bub.out.fail{background:#7a2326}
.bub .who{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.bub .meta{font-size:11px;color:var(--dim);margin-top:3px;text-align:right}
.bub.out .meta{color:#cfe2f7}
#chatHint{color:var(--dim);font-size:13px;text-align:center;padding:0 12px 6px;flex:none}
#chatBar{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);flex:none}
#chatText{flex:1;min-width:0}
#chatSend{flex:none}
#msgToast{display:none;background:#f2c200;color:#111;padding:8px 10px;font-size:15px;font-weight:600}
#msgToast.on{display:block}
nav button{position:relative}
nav .badge{position:absolute;top:3px;left:55%;margin:0}
</style>
</head>
<body>
<div id="app">
  <div id="status">
    <span id="dot"></span>
    <span><b id="sSog">--.-</b> kn</span>
    <span><b id="sCog">---</b>&deg;</span>
    <span id="sHidden" class="tag" style="display:none" data-i18n="hidden"></span>
    <span id="sDest"></span>
    <span class="sp"></span>
    <span id="sTime">--:--:--</span>
  </div>
  <div id="offline" data-i18n="offline"></div>
  <div id="alarm"><span id="alarmText"></span><button id="mute"></button></div>
  <div id="msgToast"></div>
  <main>
    <section class="page on" id="pMap">
      <canvas id="map"></canvas>
      <div id="mapBtns">
        <button id="zIn">+</button>
        <button id="zOut">&minus;</button>
        <button id="follow" class="on">&#9678;</button>
      </div>
      <div id="mapInfo"></div>
      <div id="sheet"></div>
    </section>
    <section class="page" id="pCompass"><canvas id="compass"></canvas></section>
    <section class="page" id="pNearby"><div class="wrap"><h2 data-i18n="nearby"></h2><div id="nearbyList"></div></div></section>
    <section class="page" id="pChat"><div id="chat">
      <div id="chatPeers"></div>
      <div id="chatLog"></div>
      <div id="chatHint"></div>
      <div id="chatBar"><input type="text" id="chatText" maxlength="63" autocomplete="off" enterkeyhint="send"><button class="btn" id="chatSend" data-i18n="send"></button></div>
    </div></section>
    <section class="page" id="pWp"><div class="wrap">
      <div class="seg"><button id="segWp" class="on" data-i18n="waypoints"></button><button id="segRt" data-i18n="routes"></button></div>
      <div id="wpPane">
        <div class="btns" style="margin:0 0 12px"><button class="btn" id="wpHere" data-i18n="wpHere"></button></div>
        <div id="wpList"></div><div class="hint" data-i18n="wpHint"></div>
      </div>
      <div id="rtPane" style="display:none">
        <div class="btns" style="margin:0 0 12px"><button class="btn" id="rtNew" data-i18n="rtNew"></button></div>
        <div id="rtList"></div>
      </div></div></section>
    <section class="page" id="pSetup"><div class="wrap"><h2 data-i18n="setup"></h2>
      <div class="card">
        <label data-i18n="language"></label>
        <select id="fLang"><option value="en">English</option><option value="it">Italiano</option></select>
        <label data-i18n="nodeName"></label>
        <input type="text" id="fName" maxlength="11" autocomplete="off" autocapitalize="off">
        <div class="check"><input type="checkbox" id="fShare"><span data-i18n="share"></span></div>
        <div class="hint" data-i18n="shareHint"></div>
        <label data-i18n="nodeType"></label>
        <div class="types" id="fTypes"></div>
        <div class="hint" data-i18n="typeHint"></div>
        <div id="wifiOffBox" style="display:none">
          <label data-i18n="wifiOff"></label>
          <select id="fWifiOff"><option value="0" data-i18n="wifiOffNever"></option><option value="5">5 min</option><option value="10">10 min</option><option value="30">30 min</option></select>
          <div class="hint" data-i18n="wifiOffHint"></div>
          <div id="sleepBox" style="display:none">
            <label data-i18n="sleep"></label>
            <select id="fSleep"><option value="0" data-i18n="sleepNo"></option><option value="1">1 min</option><option value="2">2 min</option><option value="3">5 min</option><option value="4">10 min</option><option value="5">15 min</option><option value="6">30 min</option><option value="7">60 min</option></select>
            <div class="hint" data-i18n="sleepHint"></div>
          </div>
        </div>
        <label data-i18n="alarmProfile"></label>
        <select id="fProfile"><option value="0" data-i18n="profHarbour"></option><option value="1" data-i18n="profCoastal"></option><option value="2" data-i18n="profOpen"></option><option value="3" data-i18n="profNight"></option><option value="4" data-i18n="profCustom"></option></select>
        <div id="customBox" style="display:none">
          <label data-i18n="customCpa"></label>
          <input type="text" inputmode="decimal" id="fCpa" maxlength="5">
          <label data-i18n="customTcpa"></label>
          <input type="text" inputmode="numeric" id="fTcpa" maxlength="3">
        </div>
        <div class="hint" id="profileHint"></div>
        <label data-i18n="alarmRange"></label>
        <select id="fRange"><option value="3">3 NM</option><option value="6">6 NM</option><option value="12">12 NM</option><option value="0" data-i18n="noLimit"></option></select>
        <div class="hint" data-i18n="rangeHint"></div>
        <div class="check"><input type="checkbox" id="fSound"><span data-i18n="alarmSound"></span></div>
        <div class="btns"><button class="btn sec" id="testSound" data-i18n="testSound"></button></div>
        <div id="netBox">
        <label data-i18n="connection"></label>
        <select id="fNet"><option value="0" data-i18n="netOffgrid"></option><option value="1" data-i18n="netDirect"></option><option value="2" data-i18n="netBoat"></option></select>
        <div class="hint" id="netHint"></div>
        <div id="boatBox" style="display:none">
          <label data-i18n="boatSsid"></label>
          <input type="text" id="fStaSsid" maxlength="32" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <label data-i18n="boatPass"></label>
          <input type="password" id="fStaPass" maxlength="64" autocomplete="off">
          <div class="hint" id="boatPassHint"></div>
        </div>
        </div>
        <label data-i18n="charts"></label>
        <select id="fTiles"><option value="0" data-i18n="tilesOnline"></option><option value="1" data-i18n="tilesSd"></option><option value="2" data-i18n="tilesNone"></option></select>
        <label data-i18n="wifiPass"></label>
        <input type="password" id="fPass" maxlength="32" autocomplete="off" placeholder="">
        <div class="hint" data-i18n="wifiHint"></div>
        <div class="btns"><button class="btn" id="save" data-i18n="save"></button><span id="saved" class="hint"></span></div>
      </div>
      <div class="card"><div class="kv" id="info"></div></div>
    </div></section>
  </main>
  <nav id="nav">
    <button data-p="pMap" class="on"><i>&#9973;</i><span data-i18n="map"></span></button>
    <button data-p="pCompass"><i>&#10022;</i><span data-i18n="compass"></span></button>
    <button data-p="pNearby"><i>&#9678;</i><span data-i18n="nearby"></span></button>
    <button data-p="pChat" id="navChat" style="display:none"><i>&#9993;</i><span data-i18n="chat"></span><b class="badge" id="navBadge" style="display:none"></b></button>
    <button data-p="pWp"><i>&#9873;</i><span data-i18n="waypoints"></span></button>
    <button data-p="pSetup"><i>&#9881;</i><span data-i18n="setup"></span></button>
  </nav>
</div>

// ---------- Compass: dark face, rotating rose, fixed red bow marker, green dot for the destination ----------
function drawCompass() {
  if(!$('pCompass').classList.contains('on')) return;
  const {c, w, h} = fit($('compass'));
  c.fillStyle = '#060d18'; c.fillRect(0, 0, w, h);
  const landscape = w > h * 1.25, side = landscape ? Math.min(h, w * 0.6) : Math.min(w, h * 0.72);
  const R = side / 2 - 22, cx = landscape ? side / 2 : w / 2, cy = landscape ? h / 2 : side / 2 + 6;
  const own = st ? st.own : null, hdg = own && own.cogValid ? own.cog : 0;
  c.strokeStyle = '#cfd8e3'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke();
  for(let d = 0; d < 360; d += 10) {
    const a = (d - hdg) * D2R, len = d % 90 === 0 ? R * 0.14 : d % 30 === 0 ? R * 0.1 : R * 0.05;
    c.lineWidth = d % 30 === 0 ? 2.5 : 1.5; c.beginPath(); c.moveTo(cx + (R - len) * Math.sin(a), cy - (R - len) * Math.cos(a)); c.lineTo(cx + R * Math.sin(a), cy - R * Math.cos(a)); c.stroke();
  }
  c.textAlign = 'center'; c.textBaseline = 'middle';
  ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'].forEach((s, i) => {
    const a = (i * 45 - hdg) * D2R, main = i % 2 === 0;
    c.font = (main ? '700 ' + Math.round(R * 0.2) : '500 ' + Math.round(R * 0.11)) + 'px sans-serif';
    c.fillStyle = i === 0 ? '#e5383b' : main ? '#fff' : '#8a97a8';
    c.fillText(s, cx + R * 0.72 * Math.sin(a), cy - R * 0.72 * Math.cos(a));
  });
  const dest = ud.wps.find(p => p.id === ud.dest); let d = null;
  if(dest && own && own.fix) {
    d = distBrg(own.lat, own.lon, dest.lat, dest.lon);
    const a = (d.brg - hdg) * D2R, x = cx + R * Math.sin(a), y = cy - R * Math.cos(a);
    c.fillStyle = '#2fd16b'; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, Math.max(8, R * 0.07), 0, 7); c.fill(); c.stroke();
  }
  c.fillStyle = '#e5383b'; c.beginPath(); c.moveTo(cx, cy - R + R * 0.13); c.lineTo(cx - R * 0.08, cy - R - 10); c.lineTo(cx + R * 0.08, cy - R - 10); c.closePath(); c.fill();
  const moving = own && own.moving;
  c.fillStyle = moving ? '#fff' : '#8a97a8'; c.font = '700 ' + Math.round(R * 0.36) + 'px sans-serif';
  c.fillText(own && own.cogValid ? pad3(hdg) + '°' : '---°', cx, cy - R * 0.04);
  c.fillStyle = '#8a97a8'; c.font = Math.round(R * 0.1) + 'px sans-serif';
  c.fillText(t('fromCog') + (moving ? '' : ' (' + t('stopped') + ')'), cx, cy + R * 0.22);
  // Small data block: beside the rose in landscape, below it in portrait
  const rows = [[t('speed'), own ? own.sog.toFixed(1) + ' kn' : '--', '#fff']];
  const ar = activeRoute(), rem = routeRemaining();
  if(ar) rows.push([t('route'), ar.name, '#e879f9']);
  if(rem !== null) rows.push([t('remaining'), fmtNm(rem) + ' NM', '#e879f9']);
  if(dest) {
    rows.push([t('dest'), dest.name, '#2fd16b']);
    if(d) {
      rows.push([t('brg'), pad3(d.brg) + '°', '#2fd16b'], [t('dist'), fmtNm(d.nm) + ' NM', '#2fd16b']);
      if(own.cogValid) { let turn = Math.round(d.brg - hdg); while(turn > 180) turn -= 360; while(turn < -180) turn += 360;
        rows.push([t('steer'), Math.abs(turn) < 3 ? t('onCourse') : Math.abs(turn) + '° ' + (turn > 0 ? t('stbd') : t('port')), '#fff']); }
    }
  }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  if(landscape) {
    let y = 30; const x = side + 8;
    for(const r of rows) { c.fillStyle = '#8a97a8'; c.font = '13px sans-serif'; c.fillText(r[0].toUpperCase(), x, y); c.fillStyle = r[2]; c.font = '600 19px sans-serif'; c.fillText(r[1], x, y + 22); y += 50; }
  } else {
    const cols = 2, cw = w / cols; let i = 0;
    for(const r of rows) { const x = 16 + (i % cols) * cw, y = side + 34 + Math.floor(i / cols) * 50;
      c.fillStyle = '#8a97a8'; c.font = '13px sans-serif'; c.fillText(r[0].toUpperCase(), x, y); c.fillStyle = r[2]; c.font = '600 19px sans-serif'; c.fillText(r[1], x, y + 22); i++; }
  }
}

let audio = null, lastBeep = 0;
function unlockAudio() { if(!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if(audio && audio.state === 'suspended') audio.resume(); }
document.addEventListener('pointerdown', unlockAudio);
function beep(n) {
  if(!audio) return;
  for(let i = 0; i < n; i++) {
    const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.24;
    o.type = 'square'; o.frequency.value = 2700; g.gain.setValueAtTime(0.5, t0); g.gain.setValueAtTime(0, t0 + 0.13);
    o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + 0.14);
  }
  if(navigator.vibrate) navigator.vibrate([150, 100, 150, 100, 150]);
}
$('testSound').onclick = () => { unlockAudio(); beep(3); };
// Silence button on the alarm banner: only for this alarm, the setting in Setup is not touched

// ---------- Chat: messages over LoRa, kept on the node ----------
// A conversation is one node (by its id) or 'ALL'. The node holds the messages; this page shows them.
let msgs = [], msgStampSeen = null, chatPeer = 'ALL', chatNames = {}, toastPeer = null, msgsLoaded = false;
const convOf = m => m.all ? 'ALL' : m.peer;
const chatOpen = () => $('pChat').classList.contains('on');
function peerName(id) {
  if(id === 'ALL') return t('everybody');
  const g = st && st.targets.find(x => x.id === id);
  return g ? g.name : (chatNames[id] || id);
}
function openChat(id, name) { if(name) chatNames[id] = name; chatPeer = id; showPage('pChat'); }
function loadMsgs() {
  return fetch('/api/messages').then(r => r.json()).then(j => {
    const had = new Set(msgs.filter(m => !m.mine).map(m => m.peer + '|' + m.text + '|' + m.all));
    msgs = j.messages || []; msgStampSeen = j.stamp;
    msgs.forEach(m => { if(m.name) chatNames[m.peer] = m.name; });
    // A message that was not there before: sound and a line at the top, unless that conversation is open
    const fresh = msgs.filter(m => !m.mine && m.unread && !had.has(m.peer + '|' + m.text + '|' + m.all));
    if(msgsLoaded && fresh.length) {
      const m = fresh[fresh.length - 1];
      if(!(chatOpen() && chatPeer === convOf(m))) {
        toastPeer = convOf(m);
        $('msgToast').textContent = t('msgFrom') + ' ' + m.name + (m.all ? ' (' + t('toAll') + ')' : '') + ': ' + m.text;
        $('msgToast').classList.add('on');
      }
      if(cfg.sound !== false) beep(2);
    }
    msgsLoaded = true;
    renderChat();
  }).catch(() => {});
}
$('msgToast').onclick = () => { $('msgToast').classList.remove('on'); if(toastPeer) openChat(toastPeer); };
function markRead() {
  if(!chatOpen() || !msgs.some(m => !m.mine && m.unread && convOf(m) === chatPeer)) return;
  msgs.forEach(m => { if(!m.mine && convOf(m) === chatPeer) m.unread = false; });
  if(toastPeer === chatPeer) $('msgToast').classList.remove('on');
  const b = new URLSearchParams(chatPeer === 'ALL' ? {all: 1} : {peer: chatPeer});
  fetch('/api/messages/read', {method: 'POST', body: b}).catch(() => {});
}
function renderChat() {
  const unread = {};
  msgs.forEach(m => { if(!m.mine && m.unread) unread[convOf(m)] = (unread[convOf(m)] || 0) + 1; });
  const total = Object.values(unread).reduce((a, b) => a + b, 0) - (chatOpen() ? (unread[chatPeer] || 0) : 0);
  $('navBadge').style.display = total > 0 ? '' : 'none'; $('navBadge').textContent = total;
  if(!chatOpen()) return;
  // Who can be written to: everybody, the nodes being received (nearest first), and whoever wrote before
  const ids = ['ALL'];
  if(st) [...st.targets].sort((a, b) => (b.alarm - a.alarm) || (a.dist - b.dist)).forEach(g => ids.push(g.id));
  msgs.forEach(m => { if(!m.all && !ids.includes(m.peer)) ids.push(m.peer); });
  if(!ids.includes(chatPeer)) ids.push(chatPeer);
  setHtml($('chatPeers'), ids.map(id => {
    const g = st && st.targets.find(x => x.id === id);
    return '<button data-id="' + id + '" class="' + (id === chatPeer ? 'on' : '') + (id !== 'ALL' && (!g || g.stale) ? ' gone' : '') + (g && g.alarm ? ' alarm' : '') + '">' +
      esc(peerName(id)) + (unread[id] && id !== chatPeer ? '<b class="badge">' + unread[id] + '</b>' : '') + '</button>';
  }).join(''));
  $('chatPeers').querySelectorAll('button').forEach(b => { b.onclick = () => { chatPeer = b.dataset.id; renderChat(); }; });
  const list = msgs.filter(m => convOf(m) === chatPeer);
  const log = $('chatLog'), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const before = log._html;
  setHtml(log, list.length ? list.map(m => {
    const age = m.age < 60 ? t('now') : Math.floor(m.age / 60) + ' ' + t('minAgo');
    if(m.mine) return '<div class="bub out' + (m.status === 5 ? ' fail' : '') + '">' + esc(m.text) + '<div class="meta">' + age + ' &middot; ' + t('st' + m.status) + (m.status >= 3 && m.status <= 4 ? ' &#10003;' + (m.status === 4 ? '&#10003;' : '') : '') + '</div></div>';
    return '<div class="bub in">' + (chatPeer === 'ALL' ? '<div class="who">' + esc(m.name) + '</div>' : '') + esc(m.text) + '<div class="meta">' + age + '</div></div>';
  }).join('') : '<div class="empty">' + t('msgNone') + '</div>');
  if(log._html !== before && atEnd) log.scrollTop = log.scrollHeight;
  const g = st && st.targets.find(x => x.id === chatPeer);
  $('chatHint').textContent = chatPeer === 'ALL' ? t('msgHintAll') : (!g || g.stale) ? t('msgHintGone') : t('msgHintOne');
  $('chatText').placeholder = t('msgPlaceholder');
  markRead();
}
function sendChat() {
  const text = $('chatText').value.trim();
  if(!text) return;
  const b = new URLSearchParams({to: chatPeer === 'ALL' ? '0' : chatPeer, name: chatPeer === 'ALL' ? '' : peerName(chatPeer), text});
  $('chatText').value = '';
  fetch('/api/messages', {method: 'POST', body: b}).then(() => loadMsgs()).then(() => { const log = $('chatLog'); log.scrollTop = log.scrollHeight; }).catch(() => { $('chatText').value = text; });
}
$('chatSend').onclick = sendChat;
$('chatText').onkeydown = e => { if(e.key === 'Enter') { e.preventDefault(); sendChat(); } };

// ---------- Pages ----------
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === id));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p === id));
  if(id !== 'pMap') closeSheet();
  renderAll();
  if(id === 'pChat') { renderChat(); const log = $('chatLog'); log.scrollTop = log.scrollHeight; }
}
document.querySelectorAll('#nav button').forEach(b => { b.onclick = () => showPage(b.dataset.p); });
window.addEventListener('resize', renderAll);

// ---------- Data from the node, once a second ----------
function poll() {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 2500);
  fetch('/api/state', {signal: ctl.signal}).then(r => r.json()).then(j => {
    clearTimeout(timer); st = j; online = true;
    if(j.udVersion !== undefined && udVersion !== null && j.udVersion !== udVersion && !fingerDown) { udVersion = j.udVersion; loadUd().then(() => renderAll()); }
    if(j.own.fix && (map.follow || !map.placed)) { map.lat = j.own.lat; map.lon = j.own.lon; map.placed = true; }
    advanceRoute();
    // Messages: asked for only when the node says something changed; their ages are refreshed meanwhile
    if(cfg.msg && j.msgStamp !== undefined) {
      if(j.msgStamp !== msgStampSeen) loadMsgs();
      else if(chatOpen() && !fingerDown) { msgs.forEach(m => { m.age++; }); if(document.activeElement !== $('chatText') || true) renderChat(); }
    }
    renderAll(true);
  }).catch(() => { clearTimeout(timer); online = false; renderStatus(); });
}
Promise.all([
  fetch('/api/config').then(r => r.json()).then(j => { cfg = j; lang = j.lang; }).catch(() => {}),
  loadUd()
]).then(() => { applyLang(); fillForm(); $('navChat').style.display = cfg.msg ? '' : 'none'; poll(); setInterval(poll, 1000); });
</script>
</body>
